<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MyCatatix</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f4f6;
            color: #222;
        }

        header {
            background: #2563eb;
            color: white;
            padding: 25px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 32px;
        }

        header p {
            margin-bottom: 0;
        }

        .container {
            max-width: 700px;
            margin: 30px auto;
            padding: 20px;
        }

        .box {
            background: white;
            padding: 20px;
            border-radius: 18px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        input,
        textarea {
            width: 100%;
            padding: 14px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
        }

        textarea {
            height: 180px;
            resize: vertical;
        }

        button {
            border: none;
            padding: 12px 18px;
            border-radius: 10px;
            font-size: 15px;
            cursor: pointer;
            margin-right: 8px;
        }

        .save {
            background: #2563eb;
            color: white;
        }

        .delete {
            background: #ef4444;
            color: white;
        }

        .message {
            margin-top: 15px;
            font-weight: bold;
        }

        footer {
            text-align: center;
            margin-top: 30px;
            color: #777;
        }
    </style>
</head>

<body>

<header>
    <h1>📝 MyCatatix</h1>
    <p>Tempat mudah untuk menyimpan catatan anda</p>
</header>

<div class="container">

    <div class="box">

        <h2>Buat Catatan</h2>

        <input
            type="text"
            id="tajuk"
            placeholder="Masukkan tajuk..."
        >

        <textarea
            id="catatan"
            placeholder="Tulis catatan anda di sini..."
        ></textarea>

        <button class="save" onclick="simpanCatatan()">
            💾 Simpan
        </button>

        <button class="delete" onclick="padamCatatan()">
            🗑️ Padam
        </button>

        <div class="message" id="mesej"></div>

    </div>

</div>

<footer>
    © 2026 MyCatatix
</footer>

<script>

function simpanCatatan() {

    let tajuk = document.getElementById("tajuk").value;
    let catatan = document.getElementById("catatan").value;

    localStorage.setItem("myCatatixTajuk", tajuk);
    localStorage.setItem("myCatatixCatatan", catatan);

    document.getElementById("mesej").textContent =
        "✅ Catatan berjaya disimpan!";
}


function padamCatatan() {

    document.getElementById("tajuk").value = "";
    document.getElementById("catatan").value = "";

    localStorage.removeItem("myCatatixTajuk");
    localStorage.removeItem("myCatatixCatatan");

    document.getElementById("mesej").textContent =
        "🗑️ Catatan telah dipadam!";
}


// Paparkan catatan yang telah disimpan
window.onload = function() {

    document.getElementById("tajuk").value =
        localStorage.getItem("myCatatixTajuk") || "";

    document.getElementById("catatan").value =
        localStorage.getItem("myCatatixCatatan") || "";
};

</script>

</body>
</html>
